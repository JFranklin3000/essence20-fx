# Publishing a GitHub release (tag "0.2.0" or "v0.2.0") builds the module and attaches module.json + module.zip to it.
# The manifest URL in module.json (releases/latest/download/module.json) then points at the newest release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      # The release's version and download link go into the manifest that ships, so a Foundry update finds this zip.
      - name: Set version and download link
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG;
            const manifest = JSON.parse(fs.readFileSync("module.json", "utf8"));
            manifest.version = tag.replace(/^v/, "");
            manifest.download = `https://github.com/${process.env.REPO}/releases/download/${tag}/module.zip`;
            fs.writeFileSync("module.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      # Everything Foundry loads - add a folder here when the module gets a new one, or it won't be in the zip.
      - name: Zip
        run: zip -r module.zip module.json README.md CHANGELOG.md LICENSE scripts languages sounds styles templates

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" module.json module.zip --clobber
